<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Match Pro - Football Predictions</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    body { background-color: #0f172a; color: #f8fafc; padding: 16px; }
    header { text-align: center; margin-bottom: 20px; }
    header h1 { color: #38bdf8; font-size: 1.5rem; }
    header p { color: #94a3b8; font-size: 0.85rem; }
    
    .card { background: #1e293b; border-radius: 12px; padding: 16px; margin-bottom: 16px; border: 1px solid #334155; }
    .teams { display: flex; justify-content: space-between; align-items: center; font-weight: bold; font-size: 1.1rem; }
    .vs { font-size: 0.8rem; color: #64748b; font-weight: normal; }
    
    .probability-bar { background: #334155; height: 10px; border-radius: 5px; margin: 12px 0; overflow: hidden; display: flex; }
    .prob-home { background: #22c55e; height: 100%; }
    .prob-draw { background: #eab308; height: 100%; }
    .prob-away { background: #ef4444; height: 100%; }
    
    .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 10px; }
    .stat-box { background: #0f172a; padding: 8px; border-radius: 6px; text-align: center; }
    .stat-val { color: #38bdf8; font-weight: bold; font-size: 0.95rem; }
    .stat-label { color: #94a3b8; font-size: 0.75rem; }
    
    .btn-vip { background: #38bdf8; color: #0f172a; width: 100%; border: none; padding: 12px; border-radius: 8px; font-weight: bold; font-size: 1rem; cursor: pointer; margin-top: 10px; }
  </style>
</head>
<body>

  <header>
    <h1>⚽ Match Pro AI</h1>
    <p>Daily Algorithmic Football Predictions</p>
  </header>

  <!-- Match Card 1 -->
  <div class="card">
    <div class="teams">
      <span>Arsenal</span>
      <span class="vs">VS</span>
      <span>Chelsea</span>
    </div>
    
    <!-- Win Probability Bar (Home 55% / Draw 25% / Away 20%) -->
    <div class="probability-bar">
      <div class="prob-home" style="width: 55%;"></div>
      <div class="prob-draw" style="width: 25%;"></div>
      <div class="prob-away" style="width: 20%;"></div>
    </div>
    
    <div class="stats-grid">
      <div class="stat-box">
        <div class="stat-val">Over 2.5 Goals</div>
        <div class="stat-label">68% Probability</div>
      </div>
      <div class="stat-box">
        <div class="stat-val">Over 9.5 Corners</div>
        <div class="stat-label">82% Probability</div>
      </div>
    </div>
  </div>

  <!-- Match Card 2 -->
  <div class="card">
    <div class="teams">
      <span>Real Madrid</span>
      <span class="vs">VS</span>
      <span>Barcelona</span>
    </div>
    
    <div class="probability-bar">
      <div class="prob-home" style="width: 45%;"></div>
      <div class="prob-draw" style="width: 30%;"></div>
      <div class="prob-away" style="width: 25%;"></div>
    </div>
    
    <div class="stats-grid">
      <div class="stat-box">
        <div class="stat-val">BTTS (Yes)</div>
        <div class="stat-label">74% Probability</div>
      </div>
      <div class="stat-box">
        <div class="stat-val">Over 4.5 Cards</div>
        <div class="stat-label">89% Probability</div>
      </div>
    </div>
  </div>

  <button class="btn-vip" onclick="alert('Unlock VIP Predictions for $9.99/mo!')">Unlock VIP Accumulator</button>

</body>
        </html>
